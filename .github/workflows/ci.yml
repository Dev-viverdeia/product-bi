name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push seguido de push na mesma branch cancela a execução anterior — o que vale
# é o estado atual do código, não a fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Mesma major do ambiente de desenvolvimento do time — CI que roda em
      # outra versão vira fonte de "aqui passa, lá não".
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # O build já roda `tsc -b` antes do bundle, então cobre type-check.
      # Variáveis do Supabase são validadas em runtime por src/lib/env.ts, não em
      # build — o bundle não precisa de segredo, e por isso o CI também não.
      - name: Build
        run: npm run build
